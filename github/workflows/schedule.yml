name: Trigger live gold agent check

on:
  schedule:
    # every 15 minutes, Mon-Fri (UTC). GitHub Actions scheduling is best-effort
    # and can be delayed by a few minutes during high load -- expected, not a bug.
    - cron: "*/15 * * * 1-5"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab too

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /run-check on the deployed agent
        run: |
          curl -sf "${{ secrets.RENDER_URL }}/run-check?token=${{ secrets.RUN_TOKEN }}" || exit 1
